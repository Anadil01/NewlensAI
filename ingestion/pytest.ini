[pytest]
# Only collect from tests/. This matters because scripts/ contains ~18 files
# named test_*.py that are manual verification scripts, not automated tests --
# several hit live APIs or a real database at import time. Without this,
# pytest would try to collect and execute them.
testpaths = tests

# Makes `from services...`, `from config...` etc. resolve when pytest is run
# from the ingestion/ directory, so test modules do not each need their own
# sys.path manipulation.
pythonpath = .

python_files = test_*.py
python_classes = *Tests
python_functions = test_*

addopts = -v --tb=short
